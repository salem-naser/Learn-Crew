[project]
name = "extract_pdf"
version = "0.1.0"
description = "Extract-Pdf using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.4.1",
    "PyPDF2>=3.0.0",
    "requests>=2.31.0",
    "jsonschema>=4.20.0"
]

[project.scripts]
extract_pdf = "extract_pdf.main:run"
run_crew = "extract_pdf.main:run"
train = "extract_pdf.main:train"
replay = "extract_pdf.main:replay"
test = "extract_pdf.main:test"
run_with_trigger = "extract_pdf.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
