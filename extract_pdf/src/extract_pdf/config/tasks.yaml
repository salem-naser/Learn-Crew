extract_pdf_task:
  description: >
    Extract all text and data from the PDF file located at {pdf_path}.
    Carefully read through each page and extract all relevant information
    including text, numbers, tables, and any structured data.
    Pay attention to the layout and structure of the document.
  expected_output: >
    Complete extracted text content from all pages of the PDF, organized by page number.
    Include all text, numbers, and data found in the document.
  agent: pdf_extractor

structure_to_json_task:
  description: >
    Take the extracted PDF data and convert it into a well-structured JSON format.
    Analyze the content and identify key data points, sections, and relationships.
    Create a clean JSON structure that represents the document's information in an
    organized and accessible way. Use appropriate JSON data types (strings, numbers,
    arrays, objects) based on the content.
  expected_output: >
    A properly formatted JSON object containing all extracted data from the PDF.
    The JSON should be well-structured, readable, and include all important information
    from the document. Return only valid JSON without markdown code blocks.
  agent: data_analyst
